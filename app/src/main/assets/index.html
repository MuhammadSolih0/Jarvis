<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jarvis</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--me:#2b5cff;--tx:#e8eaf0;--mut:#8b93a5}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif}
body{display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--card)}
header b{font-size:18px}
header button{background:none;border:0;color:var(--tx);font-size:20px;padding:4px 8px}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:88%;padding:10px 12px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word;line-height:1.4}
.user{align-self:flex-end;background:var(--me)}
.model{align-self:flex-start;background:var(--card)}
.err{color:#ff8a8a}
#bar{display:flex;gap:8px;padding:10px;background:var(--card)}
#inp{flex:1;resize:none;max-height:120px;border:0;border-radius:12px;padding:10px;background:var(--bg);color:var(--tx);font:inherit}
#go{border:0;border-radius:12px;padding:0 16px;background:var(--me);color:#fff;font-size:18px}
#set{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:16px}
#set .box{background:var(--card);padding:16px;border-radius:14px;width:100%;max-width:420px}
#set label{display:block;margin:10px 0 4px;color:var(--mut);font-size:13px}
#set input{width:100%;padding:10px;border:0;border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
#set .row{display:flex;gap:8px;margin-top:14px}
#set button{flex:1;padding:10px;border:0;border-radius:10px;font-size:15px}
</style>
</head>
<body>
<header><b>Jarvis</b><span><button id="bClear">🗑</button><button id="bSet">⚙</button></span></header>
<div id="msgs"></div>
<div id="bar"><textarea id="inp" rows="1" placeholder="Xabar yozing..."></textarea><button id="go">➤</button></div>
<div id="set"><div class="box">
<b>Sozlamalar</b>
<label>Gemini API kaliti</label><input id="key" type="password" autocomplete="off">
<label>Model nomi</label><input id="model" type="text" autocomplete="off">
<div class="row"><button id="bCancel">Bekor</button><button id="bSave" style="background:var(--me);color:#fff">Saqlash</button></div>
</div></div>
<script>
var SYS = "Sen Jarvis ismli yordamchisan. Foydalanuvchi qaysi tilda yozsa, shu tilda qisqa va aniq javob ber.";
var $ = function(id){ return document.getElementById(id); };
var hist = [];
try { hist = JSON.parse(Native.get("hist", "[]")); } catch (e) { hist = []; }
var pending = {}, busy = false, seq = 0;

function onNativeResult(id, status, b64) {
  var text = new TextDecoder().decode(Uint8Array.from(atob(b64), function(c){ return c.charCodeAt(0); }));
  var cb = pending[id]; delete pending[id];
  if (cb) cb({ status: status, text: text });
}
function callNative(model, body) {
  return new Promise(function(resolve){
    var id = "r" + (++seq);
    pending[id] = resolve;
    Native.ask(id, model, JSON.stringify(body));
  });
}
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

function add(role, text, isErr) {
  var d = document.createElement("div");
  d.className = "m " + role + (isErr ? " err" : "");
  d.textContent = text;
  $("msgs").appendChild(d);
  $("msgs").scrollTop = $("msgs").scrollHeight;
  return d;
}
function save() { Native.set("hist", JSON.stringify(hist)); }
function getModel() { return Native.get("model", "") || "gemini-3.5-flash-lite"; }

async function send() {
  var t = $("inp").value.trim();
  if (!t || busy) return;
  if (!Native.get("key", "")) { openSet(); return; }
  $("inp").value = "";
  add("user", t);
  hist.push({ role: "user", parts: [{ text: t }] });
  var el = add("model", "…");
  busy = true;
  try {
    var ctx = hist.slice(-30);
    while (ctx.length && ctx[0].role !== "user") ctx.shift();
    var body = { systemInstruction: { parts: [{ text: SYS }] }, contents: ctx };
    var r;
    for (var i = 0; i < 3; i++) {
      r = await callNative(getModel(), body);
      if (r.status !== 503 && r.status !== 429) break;
      el.textContent = "Server band, qayta urinilmoqda… (" + (i + 1) + ")";
      await sleep(3000 * (i + 1));
    }
    var j = null;
    try { j = JSON.parse(r.text); } catch (e) {}
    if (r.status !== 200) {
      hist.pop();
      el.className += " err";
      el.textContent = (j && j.error && j.error.message) || r.text || ("Xato " + r.status);
    } else {
      var parts = (j && j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || [];
      var out = parts.map(function(p){ return p.text || ""; }).join("") || "(bo'sh javob)";
      el.textContent = out;
      hist.push({ role: "model", parts: [{ text: out }] });
      save();
    }
  } catch (e) {
    hist.pop();
    el.className += " err";
    el.textContent = String(e);
  }
  busy = false;
  $("msgs").scrollTop = $("msgs").scrollHeight;
}

function openSet() {
  $("key").value = Native.get("key", "");
  $("model").value = getModel();
  $("set").style.display = "flex";
}
$("bSet").onclick = openSet;
$("bCancel").onclick = function(){ $("set").style.display = "none"; };
$("bSave").onclick = function(){
  Native.set("key", $("key").value.trim());
  Native.set("model", $("model").value.trim());
  $("set").style.display = "none";
};
$("bClear").onclick = function(){ hist = []; save(); $("msgs").innerHTML = ""; };
$("go").onclick = send;

hist.forEach(function(m){ add(m.role, m.parts.map(function(p){ return p.text; }).join("")); });
if (!Native.get("key", "")) openSet();
</script>
</body>
</html>
